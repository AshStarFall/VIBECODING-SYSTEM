name: Update repository traffic badge

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-traffic-badge
  cancel-in-progress: false

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch aggregated traffic data
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRAFFIC_TOKEN: ${{ secrets.REPO_TRAFFIC_TOKEN }}
        run: python scripts/update_repo_traffic.py

      - name: Commit updated badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repo-traffic.json
          if git diff --cached --quiet; then
            echo "Traffic badge data is unchanged."
            exit 0
          fi
          git commit -m "Update repository traffic badge"
          git push